name: Publish retained react-compiler-tracker artifact

on:
    workflow_dispatch:
        inputs:
            source_run_id:
                description: Successful pack.yml run containing the reviewed tarball
                required: true
                type: string
            source_run_attempt:
                description: Original successful pack attempt, even if a later rerun failed
                required: true
                type: string
            source_artifact_id:
                description: Immutable artifact ID from that original attempt
                required: true
                type: string
            version:
                description: Exact stable version in the retained artifact (intended migration release 3.0.5)
                required: true
                type: string
            destination:
                description: Use github after manual npm bootstrap; both for future OIDC releases
                required: true
                default: both
                type: choice
                options: [both, npm, github]
            dist_tag:
                description: Use recovery for an older missing version without moving latest
                required: true
                default: latest
                type: choice
                options: [latest, recovery]

permissions:
    contents: read

concurrency:
    group: react-compiler-tracker-publication
    cancel-in-progress: false

jobs:
    publish:
        if: github.repository == 'todoist/react-compiler-tracker' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: package-release
        env:
            SOURCE_RUN_ID: ${{ inputs.source_run_id }}
            SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
            SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
            RELEASE_VERSION: ${{ inputs.version }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        permissions:
            contents: read
            actions: read
            id-token: write
            packages: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .node-version
            - run: npm install --global npm@11.21.2 --ignore-scripts
            - name: Validate original attempt and download its exact archive by ID and digest
              id: source
              run: node .github/scripts/release-source.mjs download "$RELEASE_DIR"
              env:
                  RELEASE_DIR: ${{ runner.temp }}/react-compiler-tracker-release
            - name: Verify artifact before publication
              env:
                  RELEASE_DIR: ${{ runner.temp }}/react-compiler-tracker-release
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  SOURCE_REF: ${{ steps.source.outputs.ref }}
                  RELEASE_VERSION: ${{ inputs.version }}
              run: node .github/scripts/release.mjs verify "$RELEASE_DIR" "$SOURCE_SHA" "$RELEASE_VERSION" "$SOURCE_REF"
            - name: Publish or verify npm copy through OIDC
              if: inputs.destination == 'both' || inputs.destination == 'npm'
              env:
                  RELEASE_DIR: ${{ runner.temp }}/react-compiler-tracker-release
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  RELEASE_TAG: ${{ inputs.dist_tag }}
                  # Read the private mirror in cross-registry preflight; never sent to npmjs.
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node .github/scripts/release.mjs publish "$RELEASE_DIR" "$SOURCE_SHA" "$RELEASE_VERSION" npm "$RELEASE_TAG"
            - name: Publish or verify GitHub copy (preserve private visibility)
              if: inputs.destination == 'both' || inputs.destination == 'github'
              env:
                  RELEASE_DIR: ${{ runner.temp }}/react-compiler-tracker-release
                  SOURCE_SHA: ${{ steps.source.outputs.sha }}
                  RELEASE_VERSION: ${{ inputs.version }}
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ inputs.dist_tag }}
              run: node .github/scripts/release.mjs publish "$RELEASE_DIR" "$SOURCE_SHA" "$RELEASE_VERSION" github "$RELEASE_TAG"
